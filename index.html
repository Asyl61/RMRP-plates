    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const search = document.getElementById("search");

    function showPlates(data) {
      count.textContent = "Записей: " + data.length + " из " + PLATES_DB.length;
      if (!data.length) {
        list.innerHTML = "<div class='card'>Ничего не найдено.</div>";
        return;
      }
      list.innerHTML = data.map(item => `
        <div class="card">
          <div class="plate">${item.plate}</div>
          <div class="car">${item.car}</div>
          ${item.color ? `<div class="line">Цвет: ${item.color}</div>` : ""}
          ${item.owner ? `<div class="line">Владелец: ${item.owner}</div>` : ""}
          ${item.info ? `<div class="line">Инфо: ${item.info}</div>` : ""}
          ${item.photoUrl ? `<div class="line"><a href="${item.photoUrl}" target="_blank" rel="noopener">Открыть скриншот</a></div>` : ""}
        </div>
      `).join("");
    }

    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      const filtered = PLATES_DB.filter(item =>
        [item.plate, item.car, item.color, item.owner, item.info]
          .filter(Boolean)
          .some(val => String(val).toLowerCase().includes(q))
      );
      showPlates(filtered);
    });

    showPlates(PLATES_DB);
